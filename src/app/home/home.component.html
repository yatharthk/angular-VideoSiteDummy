<div class="jumbotron">
<div class="container col-sm-12">
<carousel class="text-center">

    <slide>
        <a class="" routerLink="videos/">
        <img  class="img-main-carousel-size" src="{{videoImageDefault}}" alt="Video List">
        </a>
        <div class="carousel-caption">
            <h3>Video List</h3>
            <p>Nulla vitae elit libero</p>
            <p><a class="btn btn-primary" routerLink="videos/">View Videos</a></p>
        </div>
    </slide>

    <slide *ngFor="let imageObj of homeImageList">
        <a class="" routerLink="videos/{{imageObj.slug}}" (click)="preventNormal($event,imageObj)">
        <img  class="img-main-carousel-size" [src]="imageObj.image" [alt]="imageObj.title">
        </a>
        <div class="carousel-caption">
            <h3>{{imageObj.name}}</h3>
            <p>Nulla vitae elit libero</p>
            <p><a class="btn btn-primary" routerLink="videos/{{imageObj.slug}}">View</a></p>
        </div>
    </slide>

</carousel>
</div>
</div>
