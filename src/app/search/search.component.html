<ng-container *ngIf="queryFromParent as query">
    <p>search works!</p>
    {{query}}
</ng-container>
<form class="d-flex" #searchForm="ngForm" (ngSubmit)="searchTerm(searchForm)">
    <input class="form-control me-2" type="search" placeholder="Search" 
     aria-label="Search" name="searchQuery" 
     [(ngModel)]="searchQuery">
    <button class="btn btn-outline-success" type="submit" [disabled]="!searchForm.valid">Search</button>
</form>
